<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WPScout showcase banner</title>
<style>
@font-face { font-family: Geist; src: url(../../../popup/fonts/Geist-Variable.woff2) format("woff2"); font-weight: 100 900; }
:root { --bg: #0F1215; --card: #171B20; --line: #252B32; --ink: #F4F6F8; --ink2: #A9B2BC; --ink3: #6E7781; --blue: #38BDF8; }
* { box-sizing: border-box; margin: 0; }
html, body { background: var(--bg); }
body { font-family: Geist, system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
.c { position: relative; overflow: hidden; background: var(--bg); }
.c::before { content: ""; position: absolute; inset: 0; background:
  radial-gradient(640px 460px at 78% 40%, rgba(2,132,199,.30), transparent 70%),
  radial-gradient(500px 340px at 0% 100%, rgba(56,189,248,.07), transparent 70%); }
.c::after { content: ""; position: absolute; inset: 0; background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 40px 40px; opacity: .16; mask-image: radial-gradient(ellipse at 75% 40%, #000 10%, transparent 70%); }
.brand { display: flex; align-items: center; gap: 12px; font-weight: 600; letter-spacing: -.01em; }
.brand svg { display: block; border-radius: 10px; box-shadow: 0 0 0 1px rgba(255,255,255,.08); }
h1 { font-weight: 650; letter-spacing: -.035em; line-height: 1.03; text-wrap: balance; }
h1 em { font-style: normal; color: var(--blue); }
.sub { color: var(--ink2); line-height: 1.45; text-wrap: balance; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 12px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); font-size: 13.5px; font-weight: 500; color: var(--ink); white-space: nowrap; }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--blue); }
.cta { display: inline-flex; align-items: center; gap: 10px; font-size: 14px; color: var(--ink3); }
.cta b { color: var(--ink); font-weight: 600; }
.dot { width: 4px; height: 4px; border-radius: 50%; background: var(--ink3); }

.shot { position: absolute; border-radius: 16px; overflow: hidden; background: #181B20;
  box-shadow: 0 0 0 1px rgba(255,255,255,.09), 0 30px 60px -10px rgba(0,0,0,.65), 0 10px 24px rgba(0,0,0,.35); }
.shot img { display: block; width: 100%; }
.shot.back { filter: brightness(.82); }
.blur { position: absolute; backdrop-filter: blur(9px); -webkit-backdrop-filter: blur(9px); background: rgba(24,27,32,.25); border-radius: 8px; }
.label { position: absolute; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--blue); display: flex; align-items: center; gap: 8px; }
.label::before { content: ""; width: 16px; height: 1px; background: var(--blue); opacity: .6; }
.callout { position: absolute; z-index: 5; border-radius: 14px; overflow: hidden; background: #181B20; padding: 10px 6px 4px;
  box-shadow: 0 0 0 1px rgba(56,189,248,.35), 0 24px 50px -8px rgba(0,0,0,.7); }
.callout .h { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink3); padding: 0 12px 4px; }
.callout img { display: block; width: 100%; }

/* 1200 × 630 */
.wide { width: 1200px; height: 630px; }
.wide .left { position: absolute; left: 60px; top: 52px; width: 430px; height: 530px; display: flex; flex-direction: column; }
.wide .brand { font-size: 22px; }
.wide h1 { font-size: 50px; margin-top: 46px; }
.wide .sub { font-size: 17.5px; margin-top: 18px; }
.wide .chips { margin-top: 26px; }
.wide .cta { margin-top: auto; }

/* 1080 × 1080 */
.sq { width: 1080px; height: 1080px; }
.sq .left { position: absolute; left: 72px; top: 68px; right: 72px; display: flex; flex-direction: column; align-items: flex-start; }
.sq .brand { font-size: 26px; }
.sq h1 { font-size: 66px; margin-top: 44px; max-width: 900px; }
.sq .sub { font-size: 21px; margin-top: 16px; max-width: 820px; }
.sq .chips { margin-top: 22px; max-width: 940px; }
.sq .chip { height: 34px; font-size: 15.5px; padding: 0 14px; }
.sq .cta { position: absolute; left: 72px; bottom: 52px; font-size: 17px; z-index: 5; }
.sq .fade { position: absolute; left: 0; right: 0; bottom: 0; height: 240px; background: linear-gradient(rgba(15,18,21,0), rgba(15,18,21,.85) 45%, var(--bg) 75%); z-index: 4; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const sq = location.search.includes('square');
const logo = (s) => `<svg width="${s}" height="${s}" viewBox="0 0 128 128"><rect width="128" height="128" rx="28" fill="#1E242B"/><g transform="translate(0 4)"><path d="M64 24 100 42 64 60 28 42Z" fill="#fff" stroke="#fff" stroke-width="4" stroke-linejoin="round"/><path d="M30 60 64 77 98 60" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M30 78 64 95 98 78" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></g></svg>`;
const chips = sq ? ['Updates', 'Vulnerabilities', 'Plugin health', 'Security', 'SEO', 'Performance', 'Hosting and CDN', 'Analytics', 'Content stats', 'Tech stack']
  : ['Updates', 'Vulnerabilities', 'Plugin health', 'Security', 'SEO', 'Performance', 'Hosting', 'Analytics', 'Content'];
// A screen: src, x, y, width (px). Overview gets its site name and logo blurred (image is 830 px wide).
function shot(src, x, y, w, cls = '', blur = false) {
  const k = w / 830;
  const b = blur ? `<div class="blur" style="left:${28*k}px;top:${30*k}px;width:${70*k}px;height:${70*k}px"></div><div class="blur" style="left:${110*k}px;top:${24*k}px;width:${214*k}px;height:${48*k}px"></div>` : '';
  return `<div class="shot ${cls}" style="left:${x}px;top:${y}px;width:${w}px"><img src="screens/${src}">${b}</div>`;
}
const callout = (src, title, x, y, w) => `<div class="callout" style="left:${x}px;top:${y}px;width:${w}px"><div class="h">${title}</div><img src="screens/${src}"></div>`;
const label = (t, x, y) => `<div class="label" style="left:${x}px;top:${y}px">${t}</div>`;
const left = `<div class="left">
  <div class="brand">${logo(sq ? 48 : 40)}WPScout</div>
  <h1>Scout any <em>WordPress</em> site in one click</h1>
  <p class="sub">Theme, plugins, updates, known vulnerabilities, security, SEO, hosting and analytics, right from your toolbar.</p>
  <div class="chips">${chips.map((c) => `<span class="chip">${c}</span>`).join('')}</div>
  ${sq ? '' : '<div class="cta"><b>Free on the Chrome Web Store</b><span class="dot"></span>No account<span class="dot"></span>No tracking</div>'}
</div>`;
document.getElementById('root').innerHTML = sq
  ? `<div class="c sq">${left}
      ${shot('c18.png', 64, 590, 310, 'back')}
      ${shot('c21.png', 706, 590, 310, 'back')}
      ${shot('c22.png', 320, 520, 440)}
      ${callout('vulns-elementor.png', 'Known vulnerabilities', 580, 800, 450)}
      <div class="fade"></div>
      <div class="cta"><b>Free on the Chrome Web Store</b><span class="dot"></span>No account<span class="dot"></span>No tracking</div>
    </div>`
  : `<div class="c wide">${left}
      ${shot('c21.png', 870, 96, 290, 'back')}
      ${shot('c22.png', 560, 48, 330)}
      ${callout('vulns-elementor.png', 'Known vulnerabilities', 740, 500, 420)}
    </div>`;
</script>
</body>
</html>
